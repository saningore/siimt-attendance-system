# MySQL login for ClassRoll.
# Use the same user and password you use in MySQL Workbench.
# Do not put quotes around the values.

db.host=localhost
db.port=3306
db.name=school_attendance
db.user=root
db.password=root

# Email sent when a register is saved. Leave mail.user empty to skip email.
# Gmail: smtp.gmail.com, port 587, and an App Password from the Google account.
# mail.from can stay empty. The message is then sent from mail.user.
mail.host=smtp.gmail.com
mail.port=587
mail.user=
mail.password=
mail.from=
